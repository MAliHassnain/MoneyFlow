<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyFlow - HB - Expense Tracker</title>
    
    <link rel="apple-touch-icon" href="money-icon.png">
    <link rel="icon" type="image/png" href="money-icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" rel="stylesheet" />
    
    <style>
        body {
            background-color: #f9fafb;
            font-family: 'Inter', sans-serif;
            color: #111827;
            -webkit-font-smoothing: antialiased;
        }

        /* PIN Auth Overlay */
        .auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f3f4f6;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: #ffffff;
            padding: 2.5rem 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 340px;
            border: 1px solid #e5e7eb;
        }
        .pin-input {
            letter-spacing: 0.5em;
            font-size: 1.5rem !important;
            padding: 0.75rem !important;
        }

        /* App Wrapper (Hidden until authenticated) */
        #mainAppWrapper {
            display: none;
        }

        /* Mobile-First Header Wrapper */
        .header-wrapper {
            background-color: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .page-title {
            font-weight: 700;
            letter-spacing: -0.025em;
            font-size: 1.25rem;
            color: #1f2937;
        }
        
        .brand-icon {
            color: #4f46e5;
            background: #e0e7ff;
            padding: 6px;
            border-radius: 8px;
            font-size: 1.1rem;
            margin-right: 8px;
        }

        .btn-primary-custom {
            background-color: #4f46e5;
            border-color: #4f46e5;
            color: white;
            font-weight: 500;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .btn-primary-custom:hover {
            background-color: #4338ca;
            border-color: #4338ca;
        }

        /* Hide default Bootstrap dropdown caret */
        .no-caret::after {
            display: none !important;
        }

        /* Ultra-Compact Summary Card (Inline) */
        .summary-card {
            background: linear-gradient(135deg, #ffffff 0%, #f9fafb 100%);
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            margin-top: 1rem;
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .total-amount {
            font-size: 1.4rem;
            font-weight: 800;
            color: #111827;
            line-height: 1;
            letter-spacing: -0.03em;
        }
        .total-label {
            font-size: 0.65rem;
            margin-bottom: 0.15rem;
        }
        .filter-select {
            background-color: #f3f4f6;
            border: 1px solid #e5e7eb;
            font-weight: 500;
            color: #374151;
            border-radius: 6px;
            width: auto;
            min-width: 110px;
        }

        /* App-Like List Item Styling */
        .expense-list {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            margin-top: 1rem;
            margin-bottom: 3rem;
            overflow: hidden;
        }
        
        .expense-item {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid #f3f4f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s;
        }
        
        .expense-item:last-child {
            border-bottom: none;
        }

        .expense-item:hover {
            background-color: #f9fafb;
        }

        .expense-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            font-size: 1.05rem;
            flex-shrink: 0;
        }

        .expense-details {
            flex-grow: 1;
            padding: 0 0.75rem;
            min-width: 0;
        }

        .expense-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 0.1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .expense-meta {
            font-size: 0.75rem;
            color: #6b7280;
        }

        .expense-amount-wrapper {
            text-align: right;
            flex-shrink: 0;
        }

        .expense-amount {
            font-weight: 700;
            font-size: 1rem;
            color: #111827;
            margin-bottom: 0.2rem;
        }

        /* Action Icons */
        .icon-action {
            background: none;
            border: none;
            color: #9ca3af;
            padding: 0.1rem 0.2rem;
            cursor: pointer;
            transition: color 0.2s ease;
            font-size: 0.9rem;
            margin-left: 0.25rem;
        }
        .icon-action.edit-btn:hover { color: #4f46e5; }
        .icon-action.delete-btn:hover { color: #ef4444; }

        /* Form Styling */
        .form-label {
            font-weight: 500;
            color: #374151;
            font-size: 0.875rem;
        }
        .form-control, .form-select {
            border-color: #d1d5db;
            border-radius: 6px;
        }
        .form-control:focus, .form-select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 0.25rem rgba(99, 102, 241, 0.25);
        }
        textarea { resize: none; }

        @media (max-width: 576px) {
            .expense-list {
                border-radius: 0;
                border-left: none;
                border-right: none;
                margin-top: 1rem;
            }
            .summary-card {
                border-radius: 0;
                border-left: none;
                border-right: none;
                margin-top: 0;
                border-top: none;
                flex-wrap: wrap;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

<div id="authScreen" class="auth-overlay">
    <div class="auth-card">
        <div class="text-center mb-4">
            <i class="fas fa-money-bill-transfer fa-3x brand-icon bg-transparent p-0 mb-3" style="font-size: 2.5rem;"></i>
            <h4 class="fw-bold m-0" id="authTitle">Loading...</h4>
            <p class="text-muted small mt-1 mb-0" id="authSubtitle">Please wait</p>
        </div>
        <form id="authForm">
            <div class="mb-3">
                <input type="password" class="form-control text-center fw-bold pin-input" id="pinInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" required autocomplete="off">
            </div>
            <div class="mb-4" id="confirmPinWrapper" style="display: none;">
                <label class="form-label small text-muted text-center w-100 mb-1">Confirm PIN</label>
                <input type="password" class="form-control text-center fw-bold pin-input" id="confirmPinInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" autocomplete="off">
            </div>
            
            <button type="submit" class="btn btn-primary-custom w-100 py-2" id="authSubmitBtn">Unlock</button>
            <div id="authError" class="text-danger small mt-3 text-center fw-medium" style="display: none;"></div>
        </form>
    </div>
</div>

<div id="mainAppWrapper">
    <div class="header-wrapper shadow-sm">
        <div class="container-md d-flex justify-content-between align-items-center">
            <h1 class="m-0 page-title d-flex align-items-center">
                <i class="fas fa-money-bill-transfer brand-icon"></i>MoneyFlow - HB
            </h1>
            
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-primary-custom btn-sm py-1 px-3" id="openAddModalBtn">
                    <i class="fas fa-plus d-sm-none"></i>
                    <span class="d-none d-sm-inline"><i class="fas fa-plus me-2"></i>New Expense</span>
                </button>
                
                <div class="dropdown">
                    <button class="btn btn-light btn-sm rounded-pill border no-caret px-2" type="button" data-bs-toggle="dropdown" aria-expanded="false" title="Settings">
                        <i class="fas fa-ellipsis-v px-1 text-muted"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0" style="font-size: 0.9rem;">
                        <li><a class="dropdown-item" href="#" id="openChangePinBtn"><i class="fas fa-key fa-fw text-secondary me-2"></i>Change PIN</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <div class="container-md p-0 p-sm-3">
        
        <div class="summary-card" id="summaryCard" style="display: none;">
            <div class="flex-grow-1">
                <div class="text-muted fw-bold text-uppercase total-label">Total Spent</div>
                <div class="total-amount" id="totalAmountDisplay">Rs 0</div>
            </div>
            
            <div class="d-flex align-items-center gap-2">
                <select class="form-select form-select-sm filter-select" id="timeFilter">
                    <option value="last_week">Last Week</option>
                    <option value="last_month" selected>Last Month</option>
                    <option value="last_year">Last Year</option>
                    <option value="last_3_years">3 Years</option>
                </select>
                
                <div class="dropdown">
                    <button class="btn btn-outline-secondary btn-sm rounded-pill no-caret px-2" type="button" data-bs-toggle="dropdown" aria-expanded="false" title="Data Menu">
                        <i class="fas fa-database px-1"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0" style="font-size: 0.9rem;">
                        <li><a class="dropdown-item" href="#" id="exportCsvBtn"><i class="fas fa-file-csv fa-fw text-secondary me-2"></i>Export CSV (Filtered)</a></li>
                        <li><a class="dropdown-item" href="#" id="backupDbBtn"><i class="fas fa-file-download fa-fw text-secondary me-2"></i>Backup DB (Full JSON)</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="#" id="restoreDbBtn"><i class="fas fa-upload fa-fw me-2"></i>Restore DB</a></li>
                    </ul>
                </div>
                <input type="file" id="restoreFileInput" accept=".json" style="display: none;">
            </div>
        </div>

        <div id="loadingIndicator" class="text-center py-5 text-muted">
            <div class="spinner-border spinner-border-sm text-primary mb-2" role="status"></div>
            <div class="small">Loading data...</div>
        </div>
        
        <div id="expenseListContainer" class="expense-list" style="display: none;">
            </div>
    </div>
</div> <div class="modal fade" id="changePinModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-bottom">
                <h5 class="modal-title fw-bold text-dark">Change PIN</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form id="changePinForm">
                    <div class="mb-3">
                        <label class="form-label small">New 4-Digit PIN</label>
                        <input type="password" class="form-control text-center tracking-widest fw-bold" id="newPin" inputmode="numeric" pattern="[0-9]*" maxlength="4" required autocomplete="off">
                    </div>
                    <div class="mb-4">
                        <label class="form-label small">Confirm New PIN</label>
                        <input type="password" class="form-control text-center tracking-widest fw-bold" id="confirmNewPin" inputmode="numeric" pattern="[0-9]*" maxlength="4" required autocomplete="off">
                    </div>
                    <div id="changePinError" class="text-danger small mb-3 text-center" style="display: none;"></div>
                    <button type="submit" class="btn btn-primary-custom w-100">Update PIN</button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="expenseModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-bottom">
                <h5 class="modal-title fw-bold text-dark" id="modalTitle">Add Expense</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form id="expenseForm">
                    <input type="hidden" id="expenseId">
                    
                    <div class="mb-4">
                        <label for="expenseName" class="form-label">Category</label>
                        <select class="form-select w-100" id="expenseName" required>
                            <option value="" disabled selected>Select category...</option>
                            <option value="Grocery">Grocery</option>
                            <option value="Car Accessories">Car Accessories</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Dress & Clothing">Dress & Clothing</option>
                            <option value="Food & Dining">Food & Dining</option>
                            <option value="Outing">Outing</option>
                            <option value="Travel">Travel</option>
                            <option value="Digital Subscriptions">Digital Subscriptions</option>
                            <option value="Electronics & Gadgets">Electronics & Gadgets</option>
                            <option value="Grooming & Care">Grooming & Care</option>
                            <option value="Vehicle Tax & Registration">Vehicle Tax & Registration</option>
                            <option value="Rent">Rent</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Internet & Mobile">Internet & Mobile</option>
                            <option value="Health & Medicine">Health & Medicine</option>
                            <option value="Insurance">Insurance</option>
                            <option value="Fuel">Fuel</option>
                            <option value="Public Transit">Public Transit</option>
                            <option value="Gym & Activewear">Gym & Activewear</option>
                            <option value="Home Supplies">Home Supplies</option>
                            <option value="Education">Education</option>
                            <option value="Gifts & Donations">Gifts & Donations</option>
                            <option value="Savings & Investments">Savings & Investments</option>
                            <option value="Furniture & Decor">Furniture & Decor</option>
                            <option value="Pet Care">Pet Care</option>
                            <option value="Home Repairs">Home Repairs</option>
                            <option value="Live Events & Sports">Live Events & Sports</option>
                            <option value="Books & Stationery">Books & Stationery</option>
                            <option value="Laundry & Services">Laundry & Services</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-6 mb-4">
                            <label for="expenseAmount" class="form-label">Amount</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted">Rs</span>
                                <input type="number" step="1" class="form-control" id="expenseAmount" placeholder="0" required>
                            </div>
                        </div>
                        <div class="col-6 mb-4">
                            <label for="expensePaidVia" class="form-label">Paid Via</label>
                            <select class="form-select" id="expensePaidVia" required>
                                <option value="Cash" selected>Cash</option>
                                <option value="Card">Card</option>
                                <option value="Online">Online</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-2">
                        <label for="expenseDescription" class="form-label">Description <span class="text-muted fw-normal">(Optional)</span></label>
                        <textarea class="form-control" id="expenseDescription" rows="2" placeholder="Add notes..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer border-top bg-light">
                <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary-custom" id="saveExpenseBtn">Save Record</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-body text-center p-4">
                <div class="mb-3">
                    <i class="fas fa-exclamation-triangle fa-2x text-danger"></i>
                </div>
                <h5 class="mb-2 fw-bold">Delete Record</h5>
                <p class="text-muted small mb-4">Are you sure? This action cannot be undone.</p>
                <input type="hidden" id="deleteExpenseId">
                <div class="d-flex justify-content-center gap-2">
                    <button type="button" class="btn btn-light border w-50" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger w-50" id="confirmDeleteBtn">Delete</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

<script>
$(document).ready(function() {
    // Configure localForage
    localforage.config({ name: 'MoneyFlowApp', storeName: 'expenses' });
    const STORAGE_KEY = 'moneyFlowData';
    const PIN_KEY = 'moneyFlowPin';
    
    let allExpenses = []; 
    let currentAppPin = null;
    let isSettingUpPin = false;

    // Initialize Modals
    const expenseModal = new bootstrap.Modal(document.getElementById('expenseModal'));
    const deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));
    const changePinModal = new bootstrap.Modal(document.getElementById('changePinModal'));
    
    // Initialize Select2
    $('#expenseName').select2({
        theme: 'bootstrap-5',
        dropdownParent: $('#expenseModal'),
        placeholder: "Search category...",
        width: '100%'
    });

    // --- AUTHENTICATION LOGIC ---
    localforage.getItem(PIN_KEY).then(function(savedPin) {
        if (!savedPin) {
            // First time setup: require double PIN entry
            isSettingUpPin = true;
            $('#authTitle').text('Welcome!');
            $('#authSubtitle').text('Set a 4-digit PIN to secure your app');
            $('#authSubmitBtn').text('Set PIN');
            $('#confirmPinWrapper').show();
            $('#confirmPinInput').prop('required', true);
        } else {
            // Returning user: single PIN entry
            isSettingUpPin = false;
            currentAppPin = savedPin;
            $('#authTitle').text('Enter PIN');
            $('#authSubtitle').text('Unlock MoneyFlow - HB');
            $('#authSubmitBtn').text('Unlock');
            $('#confirmPinWrapper').hide();
            $('#confirmPinInput').prop('required', false);
        }
    });

    $('#authForm').submit(function(e) {
        e.preventDefault();
        const inputPin = $('#pinInput').val().trim();
        const $error = $('#authError');
        
        if (inputPin.length !== 4) {
            $error.text("PIN must be exactly 4 digits").show();
            return;
        }

        if (isSettingUpPin) {
            // First time setup - check confirmation
            const confirmPin = $('#confirmPinInput').val().trim();
            if (inputPin !== confirmPin) {
                $error.text("PINs do not match! Please try again.").show();
                $('#confirmPinInput').val('');
                return;
            }
            // Save new PIN
            localforage.setItem(PIN_KEY, inputPin).then(function() {
                currentAppPin = inputPin;
                unlockApp();
            });
        } else {
            // Verify returning PIN
            if (inputPin === currentAppPin) {
                unlockApp();
            } else {
                $error.text("Incorrect PIN. Try again.").show();
                $('#pinInput').val('').focus();
            }
        }
    });

    function unlockApp() {
        $('#authScreen').fadeOut(300, function() {
            $('#mainAppWrapper').fadeIn(300);
            loadAppData();
        });
    }

    // --- CHANGE PIN LOGIC ---
    $('#openChangePinBtn').click(function(e) {
        e.preventDefault();
        $('#changePinForm')[0].reset();
        $('#changePinError').hide();
        changePinModal.show();
    });

    $('#changePinForm').submit(function(e) {
        e.preventDefault();
        const newPin = $('#newPin').val().trim();
        const confirmPin = $('#confirmNewPin').val().trim();
        const $error = $('#changePinError');

        if (newPin.length !== 4 || confirmPin.length !== 4) {
            $error.text("PIN must be exactly 4 digits").show();
            return;
        }

        if (newPin !== confirmPin) {
            $error.text("New PINs do not match").show();
            return;
        }

        localforage.setItem(PIN_KEY, newPin).then(function() {
            currentAppPin = newPin;
            changePinModal.hide();
            alert("PIN updated successfully!");
        });
    });

    // --- APP DATA LOGIC ---
    function loadAppData() {
        localforage.getItem(STORAGE_KEY).then(function(value) {
            allExpenses = value || [];
            $('#loadingIndicator').hide();
            $('#summaryCard').addClass('d-flex').show();
            $('#expenseListContainer').show();
            renderList();
        }).catch(function(err) {
            console.error("Error loading data:", err);
            $('#loadingIndicator').text('Error loading data.');
        });
    }

    // Trigger re-render when Filter changes
    $('#timeFilter').change(function() {
        renderList();
    });

    // Filtering Logic
    function getFilteredExpenses() {
        const filterVal = $('#timeFilter').val();
        const now = new Date();
        let cutoffDate = new Date();

        if (filterVal === 'last_week') {
            cutoffDate.setDate(now.getDate() - 7);
        } else if (filterVal === 'last_month') {
            cutoffDate.setDate(now.getDate() - 30); 
        } else if (filterVal === 'last_year') {
            cutoffDate.setDate(now.getDate() - 365);
        } else if (filterVal === 'last_3_years') {
            cutoffDate.setDate(now.getDate() - (365 * 3));
        }

        return allExpenses.filter(exp => new Date(exp.createdAt) >= cutoffDate);
    }

    // Helper: Category Icons
    function getCategoryIcon(category) {
        const icons = {
            "Grocery": "fa-shopping-basket", "Car Accessories": "fa-car", "Shopping": "fa-shopping-bag",
            "Food & Dining": "fa-utensils", "Travel": "fa-plane", "Digital Subscriptions": "fa-play",
            "Fuel": "fa-gas-pump", "Health & Medicine": "fa-notes-medical"
        };
        return icons[category] || "fa-receipt";
    }

    // Format Date
    function formatDate(dateString) {
        if (!dateString) return '';
        const d = new Date(dateString);
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    // Format Currency (PKR)
    function formatCurrency(amount) {
        return parseFloat(amount).toLocaleString('en-PK', {
            minimumFractionDigits: 0, 
            maximumFractionDigits: 2
        });
    }

    // Core Render Function
    function renderList() {
        const container = $('#expenseListContainer');
        container.empty();

        const filteredExpenses = getFilteredExpenses();

        const total = filteredExpenses.reduce((sum, exp) => sum + parseFloat(exp.amount), 0);
        $('#totalAmountDisplay').text('Rs ' + formatCurrency(total));

        if (filteredExpenses.length === 0) {
            container.append(`
                <div class="text-center text-muted py-5 px-3">
                    <i class="fas fa-wallet fa-3x mb-3 text-light"></i>
                    <p class="mb-0 small">No expenses found for this period.</p>
                </div>
            `);
            return;
        }

        const sortedExpenses = [...filteredExpenses].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

        sortedExpenses.forEach(exp => {
            const icon = getCategoryIcon(exp.name);
            
            // Determine icon for payment method
            let methodIcon = 'fa-credit-card';
            if (exp.paidVia === 'Cash') methodIcon = 'fa-money-bill-wave';
            else if (exp.paidVia === 'Online') methodIcon = 'fa-globe';
            else if (exp.paidVia === 'Other') methodIcon = 'fa-wallet';
            
            const itemHtml = `
                <div class="expense-item">
                    <div class="expense-icon">
                        <i class="fas ${icon}"></i>
                    </div>
                    <div class="expense-details">
                        <div class="expense-title">${exp.name}</div>
                        <div class="expense-meta">
                            <i class="fas ${methodIcon} me-1"></i>${exp.paidVia} &bull; ${formatDate(exp.createdAt)}
                        </div>
                        ${exp.description ? `<div class="expense-meta mt-1 fst-italic text-truncate">${exp.description}</div>` : ''}
                    </div>
                    <div class="expense-amount-wrapper">
                        <div class="expense-amount">Rs ${formatCurrency(exp.amount)}</div>
                        <div>
                            <button class="icon-action edit-btn" onclick="openEditModal('${exp.id}')" title="Edit">
                                <i class="fas fa-pen"></i>
                            </button>
                            <button class="icon-action delete-btn" onclick="openDeleteModal('${exp.id}')" title="Delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            container.append(itemHtml);
        });
    }

    // CSV Export Functionality
    $('#exportCsvBtn').click(function(e) {
        e.preventDefault();
        const filteredData = getFilteredExpenses();
        if (filteredData.length === 0) {
            alert('No data to export for the selected time frame.');
            return;
        }

        let csvContent = "Category,Amount (PKR),Paid Via,Description,Created At\n";

        filteredData.forEach(row => {
            let safeDesc = row.description ? `"${row.description.replace(/"/g, '""')}"` : '""';
            let safeDate = `"${new Date(row.createdAt).toLocaleDateString('en-US')}"`;
            csvContent += `"${row.name}",${row.amount},"${row.paidVia}",${safeDesc},${safeDate}\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        const timeFilterLabel = $('#timeFilter option:selected').text().replace(/\s+/g, '_').toLowerCase();
        
        link.setAttribute("href", url);
        link.setAttribute("download", `moneyflow_${timeFilterLabel}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });

    // Backup DB (Full JSON Export)
    $('#backupDbBtn').click(function(e) {
        e.preventDefault();
        if (allExpenses.length === 0) {
            alert('No data to backup.');
            return;
        }
        
        const dataStr = JSON.stringify(allExpenses, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        const dateStr = new Date().toISOString().split('T')[0];
        link.download = `moneyflow_backup_${dateStr}.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });

    // Restore DB 
    $('#restoreDbBtn').click(function(e) {
        e.preventDefault();
        $('#restoreFileInput').click();
    });

    $('#restoreFileInput').change(function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            try {
                const importedData = JSON.parse(event.target.result);
                
                if (!Array.isArray(importedData)) {
                    throw new Error("Invalid format: File is not an array.");
                }
                
                if (confirm('WARNING: This will replace all your current data with the backup file. Do you want to proceed?')) {
                    allExpenses = importedData;
                    localforage.setItem(STORAGE_KEY, allExpenses).then(function() {
                        renderList();
                        alert('Database restored successfully!');
                    }).catch(function(err) {
                        console.error('Error saving restored data:', err);
                        alert('Failed to save restored data.');
                    });
                }
            } catch (err) {
                console.error(err);
                alert('Invalid backup file. Please select a valid MoneyFlow JSON backup.');
            }
            $('#restoreFileInput').val('');
        };
        reader.readAsText(file);
    });

    // Save Data Function 
    function saveToStorage() {
        $('#saveExpenseBtn').prop('disabled', true).text('Saving...');
        localforage.setItem(STORAGE_KEY, allExpenses).then(function() {
            renderList();
            expenseModal.hide();
            $('#saveExpenseBtn').prop('disabled', false).text('Save Record');
        }).catch(function(err) {
            console.error("Error saving data:", err);
            alert("Failed to save data!");
            $('#saveExpenseBtn').prop('disabled', false).text('Save Record');
        });
    }

    // Add Modal Trigger
    $('#openAddModalBtn').click(function() {
        $('#expenseForm')[0].reset();
        $('#expenseId').val('');
        $('#expenseName').val('').trigger('change');
        $('#modalTitle').text('Add Expense');
        expenseModal.show();
    });

    // Save Record (Add/Update)
    $('#saveExpenseBtn').click(function() {
        const id = $('#expenseId').val();
        const name = $('#expenseName').val();
        const amount = $('#expenseAmount').val();
        const paidVia = $('#expensePaidVia').val();
        const description = $('#expenseDescription').val().trim();
        const now = new Date().toISOString();

        if (!name || !amount) {
            alert('Category and Amount are required.');
            return;
        }

        if (id) {
            const index = allExpenses.findIndex(e => e.id === id);
            if (index !== -1) {
                allExpenses[index].name = name;
                allExpenses[index].amount = amount;
                allExpenses[index].paidVia = paidVia;
                allExpenses[index].description = description;
                allExpenses[index].updatedAt = now;
            }
        } else {
            allExpenses.push({
                id: Date.now().toString(),
                name, amount, paidVia, description,
                createdAt: now, updatedAt: now
            });
        }

        saveToStorage();
    });

    // Edit Modal Trigger
    window.openEditModal = function(id) {
        const exp = allExpenses.find(e => e.id === id);
        if (exp) {
            $('#expenseId').val(exp.id);
            $('#expenseName').val(exp.name).trigger('change');
            $('#expenseAmount').val(exp.amount);
            $('#expensePaidVia').val(exp.paidVia);
            $('#expenseDescription').val(exp.description);
            $('#modalTitle').text('Edit Expense');
            expenseModal.show();
        }
    };

    // Delete Modal Trigger
    window.openDeleteModal = function(id) {
        $('#deleteExpenseId').val(id);
        deleteModal.show();
    };

    // Confirm Delete
    $('#confirmDeleteBtn').click(function() {
        const id = $('#deleteExpenseId').val();
        allExpenses = allExpenses.filter(e => e.id !== id);
        
        localforage.setItem(STORAGE_KEY, allExpenses).then(function() {
            renderList();
            deleteModal.hide();
        });
    });
});
</script>

</body>
</html>
